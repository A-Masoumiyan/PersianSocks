name: Validate Android parity
on:
  workflow_dispatch:
  push:
    branches: [main, feat/android-030-parity]
    paths: ['app/**', 'tests/**', 'scripts/**', '.github/workflows/android-parity.yml']
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/**', '.github/workflows/android-parity.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify native input
        run: echo '15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar' | sha256sum -c -
      - name: Host transport and policy tests
        run: |
          curl -fL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          python3 scripts/run-tests.py --jdk "$JAVA_HOME" --json /tmp/json.jar
      - name: Android unit tests and unsigned release
        run: gradle --no-daemon :app:testPersonalDebugUnitTest :app:assemblePersonalDebug :app:assemblePersonalRelease -x :app:verifyReleaseInputs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android VPN guard and startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/personal/debug/app-personal-debug.apk
            adb shell appops set ir.persiansocks.app ACTIVATE_VPN allow
            adb shell pm grant ir.persiansocks.app android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w ir.persiansocks.app/.ParityInstrumentation | tee /tmp/android-native.txt
            grep 'PARITY_NATIVE_PASS' /tmp/android-native.txt
      - name: Prepare unsigned artifact and signing tools
        run: |
          mkdir -p /tmp/android-build/sdk/build-tools/35.0.0/lib /tmp/android-build/sdk/build-tools/35.0.0/lib64
          cp app/build/outputs/apk/personal/release/*unsigned.apk /tmp/android-build/PersianSocks-0.30.0-unsigned.apk
          for name in apksigner aapt zipalign; do cp "$ANDROID_HOME/build-tools/35.0.0/$name" /tmp/android-build/sdk/build-tools/35.0.0/; done
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-build/sdk/build-tools/35.0.0/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/"* /tmp/android-build/sdk/build-tools/35.0.0/lib64/
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-Android-0.30.0-unsigned
          path: /tmp/android-build/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-evidence
          path: |
            app/build/test-results/
            app/build/reports/tests/
            /tmp/android-native.txt
