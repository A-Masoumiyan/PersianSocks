name: Build Project B PathFinder APK
on:
  push:
    branches: [project-b-pathfinder-v0-1]
    paths:
      - "project-b/**"
      - ".github/workflows/project-b-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build standalone Project B APK
        run: gradle -p project-b --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Project-B-PathFinder-v0.1-APK
          path: project-b/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
