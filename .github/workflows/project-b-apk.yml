name: Build Project B PathFinder APK
on:
  push:
    branches: [project-b-pathfinder-v0-1]
    paths:
      - "project-b/**"
      - ".github/workflows/project-b-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages with preinstalled sdkmanager
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build standalone Project B APK
        run: gradle -p project-b --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Project-B-PathFinder-v0.1-APK
          path: project-b/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
