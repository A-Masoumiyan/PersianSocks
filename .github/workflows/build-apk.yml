name: Build PersianSocks APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download verified upstream tun2socks AAR
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/heiher/hev-socks5-tunnel/releases/download/2.18.0/hev-socks5-tunnel.aar' \
            -o app/libs/hev-socks5-tunnel.aar
          echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
          unzip -t app/libs/hev-socks5-tunnel.aar
      - name: Build debug APK
        run: gradle --no-daemon :app:assemblePersonalDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-debug-apk
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
