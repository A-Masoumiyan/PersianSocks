name: Build PersianSocks APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download verified upstream tun2socks AAR
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/heiher/hev-socks5-tunnel/releases/download/2.18.0/hev-socks5-tunnel.aar' \
            -o app/libs/hev-socks5-tunnel.aar
          echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
          unzip -t app/libs/hev-socks5-tunnel.aar
      - name: Host security and Split Tunneling tests
        run: |
          curl -fL 'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar' -o /tmp/persiansocks-json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/persiansocks-json.jar' | sha256sum -c -
          python3 scripts/run-tests.py --jdk "$JAVA_HOME" --json /tmp/persiansocks-json.jar
          python3 tests/release_security_test.py --jdk "$JAVA_HOME"
      - name: Build and lint both debug profiles
        run: gradle --no-daemon :app:assemblePersonalDebug :app:assemblePlayDebug :app:lintPersonalDebug :app:lintPlayDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
