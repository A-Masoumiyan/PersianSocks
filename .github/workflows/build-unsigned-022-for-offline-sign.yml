name: Build unsigned Android 0.22.0 for offline official signing
on:
  push:
    branches: [feature/android-favorites-swipe-022]
    paths:
      - '.github/oneoff-android-022-official.request'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify checked-in native tunnel library
        run: |
          echo '15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar' | sha256sum -c -
      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assemblePersonalRelease
      - name: Align and verify release binary (no keys in CI)
        run: |
          set -euo pipefail
          mkdir -p publication-staging
          apk=$(find app/build/outputs/apk/personal/release -name '*.apk' -type f | head -1)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$apk" publication-staging/PersianSocks-0.22.0-UNSIGNED-ALIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 publication-staging/PersianSocks-0.22.0-UNSIGNED-ALIGNED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging publication-staging/PersianSocks-0.22.0-UNSIGNED-ALIGNED.apk | grep -E "^package: name='ir.persiansocks.app' versionCode='23' versionName='0.22.0'"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" publication-staging/
          sha256sum publication-staging/*
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-0.22.0-unsigned-verified-for-offline-sign
          path: publication-staging/*
          if-no-files-found: error
