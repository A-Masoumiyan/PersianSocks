name: Update Windows release notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-windows-notes.yml', '.github/windows-0.5.0-notes.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update verified Windows 0.5.0 notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit windows-v0.5.0 --notes-file .github/windows-0.5.0-notes.md
