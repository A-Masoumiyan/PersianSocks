name: Publish signed Android 0.21.0
on:
  push:
    branches: [codex/android-speed-020]
    paths: ['publication/PersianSocks-0.21.0.apk', 'publication/PersianSocks-0.21.0.sha256', '.github/workflows/publish-android-020.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: persiansocks-android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK and preserve current Windows binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp publication/PersianSocks-0.21.0.apk release-assets/
          printf '%s  %s\n' "$(cat publication/PersianSocks-0.21.0.sha256)" release-assets/PersianSocks-0.21.0.apk | sha256sum -c -
          gh release download v0.20.0 --pattern 'PersianSocks-Windows-0.4.0-x64.exe' --dir release-assets
          printf '%s  %s\n' '124102caf938bf77d0add894742729724bb953fc1fa9bbd6bc390141be16548c' release-assets/PersianSocks-Windows-0.4.0-x64.exe | sha256sum -c -
      - name: Publish versioned release after asset verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.21.0
          title='ورژن جدید — PersianSocks | Android 0.21.0 · Windows 0.4.0'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes-file .github/release-0.21.0.md release-assets/*
          fi
          gh api "repos/$GH_REPO/releases" > release-list.json
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          releases=json.loads(Path('release-list.json').read_text())
          release=next(r for r in releases if r['tag_name']=='v0.21.0')
          assets={a['name']:a for a in release['assets']}
          for file in Path('release-assets').iterdir():
              asset=assets[file.name]
              assert asset['size']==file.stat().st_size, file.name+' size mismatch'
              assert asset['digest']=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest(), file.name+' digest mismatch'
          Path('release-id.txt').write_text(str(release['id']))
          PY
          release_id=$(cat release-id.txt)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true >/dev/null
          gh release view "$tag" --json url,name,assets
