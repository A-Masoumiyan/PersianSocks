name: Verify Android 0.22.0 - one time test build
on:
  push:
    branches: [feature/android-favorites-swipe-022]
    paths:
      - '.github/oneoff-android-022.request'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools and SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify native tunnel AAR
        run: |
          echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
      - name: Compile personal debug APK
        run: gradle --no-daemon :app:assemblePersonalDebug
      - name: Verify APK metadata and signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/personal/debug -name '*.apk' -type f | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package:"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-0.22.0-DEBUG-not-upgradable
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
      - name: Publish TEST ONLY Android APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/personal/debug -name '*.apk' -type f | head -1)
          cp "$apk" PersianSocks-0.22.0-DEBUG-TEST.apk
          cat > /tmp/persiansocks-debug-notes.md <<'NOTES'
          ⚠️ **آزمایشی - نسخه رسمی نیست**. امضا از نوع Debug است و نصب مستقیم روی نسخه رسمی 0.21.0 بدون حذف آن امکان‌پذیر نیست. برای ارتقای ایمن باید با کلید رسمی امضا شود. وضعیت رفع هشدار Google Play Protect هم تأیید نشده است.

          - Android 0.22.0 (versionCode 23)
          - علاقه‌مندی‌ها، سوایپ چپ تست دانلود، سوایپ راست پینگ، مرتب‌سازی ترکیبی زیر دانلود سریع
          - تست: ساخت Debug و تأیید apksigner/aapt در CI موفق؛ تست گوشی واقعی و سازگاری ارتقا انجام نشده
          - نسخه رسمی 0.21.0 بدون تغییر حفظ شده است
          NOTES
          gh release create v0.22.0-debug-preview PersianSocks-0.22.0-DEBUG-TEST.apk --prerelease --target "$GITHUB_SHA" --title 'PersianSocks Android 0.22.0 — Debug Test (NOT OFFICIAL)' --notes-file /tmp/persiansocks-debug-notes.md
