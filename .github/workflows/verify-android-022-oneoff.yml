name: Verify Android 0.22.0 - one time test build
on:
  push:
    branches: [feature/android-favorites-swipe-022]
    paths:
      - '.github/oneoff-android-022.request'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify native tunnel AAR
        run: |
          echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
      - name: Compile personal debug APK
        run: gradle --no-daemon :app:assemblePersonalDebug
      - name: Verify APK metadata and signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/personal/debug -name '*.apk' -type f | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package:"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-0.22.0-DEBUG-not-upgradable
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
