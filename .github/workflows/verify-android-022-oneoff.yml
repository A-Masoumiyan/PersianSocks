name: Verify Android 0.22.0 - one time test build
on:
  push:
    branches: [feature/android-favorites-swipe-022]
    paths:
      - '.github/oneoff-android-022.request'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools and SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fL --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-unpacked
          mv /tmp/android-unpacked/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify native tunnel AAR
        run: |
          echo "15ec8ed121663b562c99caa5bb602d1009f24e5b09e733438b81988f12feaaab  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
      - name: Compile personal debug APK
        run: gradle --no-daemon :app:assemblePersonalDebug
      - name: Verify APK metadata and signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/personal/debug -name '*.apk' -type f | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package:"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-0.22.0-DEBUG-not-upgradable
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
