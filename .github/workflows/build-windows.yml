name: Build and publish Windows
on:
  push:
    branches: [main, codex/filtered-speed-release-019]
    paths: ['windows/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: persiansocks-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Build verified self-contained EXE
        shell: pwsh
        run: ./windows/build.ps1
      - name: Validate on Windows
        shell: pwsh
        run: |
          $env:PERSIANSOCKS_TEST_CORE = (Resolve-Path windows/release/bin/sing-box.exe).Path
          Set-Location windows
          go test -race -buildvcs=false -v .
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
      - name: Publish current Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v0.19.0'
          $name = 'PersianSocks-Windows-0.4.0-x64.exe'
          $apk = 'publication/PersianSocks-0.19.0.apk'
          if ((Get-FileHash -Algorithm SHA256 $apk).Hash.ToLowerInvariant() -ne (Get-Content publication/PersianSocks-0.19.0.sha256).Trim()) { throw 'APK digest mismatch' }
          Copy-Item windows/release/PersianSocks.exe $name
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title 'ورژن جدید — PersianSocks | Android 0.19.0 · Windows 0.4.0' --notes-file .github/release-0.19.0.md $name $apk
          } else {
            gh release upload $tag $name $apk --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = gh api "repos/$env:GH_REPO/releases/tags/$tag" | ConvertFrom-Json
          foreach ($file in @($name, $apk)) {
            $asset = $release.assets | Where-Object name -eq (Split-Path $file -Leaf)
            if (!$asset -or $asset.size -ne (Get-Item $file).Length) { throw 'Uploaded size mismatch' }
          }
          gh release edit $tag --draft=false --latest --notes-file .github/release-0.19.0.md --title 'ورژن جدید — PersianSocks | Android 0.19.0 · Windows 0.4.0'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PersianSocks-Windows-0.4.0-x64
          path: windows/release/PersianSocks.exe
