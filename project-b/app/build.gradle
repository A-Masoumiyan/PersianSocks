plugins {
    id "com.android.application"
}
android {
    namespace "ir.pathfinder.b"
    compileSdk 35
    defaultConfig {
        applicationId "ir.pathfinder.b"
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName "0.5.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation files('../../app/libs/hev-socks5-tunnel.aar') }

tasks.register('seedOfflineCandidates') {
    doLast {
        def assets = rootProject.file('../app/src/main/assets')
        def pairs = [
            'bootstrap-socks5.txt':'offline-socks5.txt',
            'bootstrap-http.txt':'offline-http.txt',
            'ip-country.bin':'offline-ip-country.bin'
        ]
        pairs.each { input, output ->
            def fileIn = new File(assets,input)
            if (!fileIn.isFile()) throw new GradleException('Missing pinned asset: '+input)
            copy { from fileIn; into file('src/main/assets'); rename input, output }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'seedOfflineCandidates' }
