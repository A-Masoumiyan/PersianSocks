plugins { id 'com.android.application' }

android {
    namespace 'ir.persiansocks.app'
    compileSdk 36
    defaultConfig {
        applicationId 'ir.persiansocks.app'
        buildConfigField 'String', 'PRIVACY_POLICY_URL', groovy.json.JsonOutput.toJson(project.findProperty('privacyPolicyUrl') ?: '')
        minSdk 29
        targetSdk 36
        versionCode 19
        versionName '0.18.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'distribution'
    productFlavors {
        personal { dimension 'distribution'; manifestPlaceholders = [playDistribution: 'false']; buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'false' }
        play { dimension 'distribution'; manifestPlaceholders = [playDistribution: 'true']; buildConfigField 'boolean', 'PLAY_DISTRIBUTION', 'true' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {
    implementation files('libs/hev-socks5-tunnel.aar')
}
